<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hans Orb Blast - Main Dapat Saldo</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; touch-action: none; position: relative;
        }
        #gameCanvas { display: block; width: 100%; height: 100vh; z-index: 1; }
        .ui-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(10, 22, 40, 0.95); z-index: 100; overflow-y: auto;
        }
        .hidden { display: none !important; }
        .box { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            border-radius: 20px; padding: 20px; margin: 10px; width: 95%; max-width: 400px; 
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { color: #ffd700; margin: 0 0 15px 0; font-size: 28px; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
        .stat { font-size: 18px; color: #00ff88; margin: 10px 0; font-weight: bold; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; }
        
        /* ✅ TOMBOL SELALU AKTIF */
        .btn { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer; color: white; position: relative; z-index: 101; 
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); color: #000; } /* KUNING TERANG */
        .btn-secondary { background: linear-gradient(135deg, #007BFF 0%, #0056b3 100%); }
        .btn-danger { background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%); }
        .btn-wd { background: linear-gradient(135deg, #a55eea 0%, #8854d0 100%); }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
        .hud-item { background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 25px; font-weight: bold; color: #ffd700; border: 2px solid #ffd700; font-size: 14px; }
        
        .center-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .center-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; border-radius: 20px; text-align: center; border: 3px solid #ffd700; width: 90%; max-width: 350px; position: relative; }
        .timer-text { font-size: 56px; font-weight: bold; color: #ffd700; margin: 20px 0; }
        .overlay-btn { background: #555 !important; color: #aaa !important; border: none !important; padding: 18px 40px !important; border-radius: 50px !important; font-size: 20px !important; font-weight: 900 !important; width: 100%; cursor: not-allowed; }
        .overlay-btn.ready { background: #2ed573 !important; color: white !important; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .emergency-close { position: absolute; top: 10px; right: 15px; background: red; color: white; border: 2px solid white; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 10000001; }
        
        #backToMenuBtn { position: absolute; top: 10px; right: 10px; background: rgba(255, 71, 87, 0.9); color: white; border: 2px solid white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 20; display: none; }
        #soundToggle { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,0.9); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 15; display: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: #2c3e50; border-radius: 15px; padding: 20px; width: 90%; max-width: 350px; border: 2px solid #ffd700; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #1a252f; color: white; font-size: 16px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div class="hud-item">Skor: <span id="scoreDisplay">0</span></div>
        <div class="hud-item">WD: <span id="wdDisplay">0</span>/<span id="wdTargetDisplay">30</span></div>
    </div>

    <button id="backToMenuBtn" onclick="backToMenu()">◀ MENU</button>
    <canvas id="gameCanvas"></canvas>
    <button id="soundToggle" onclick="toggleSound()">🔊</button>

    <div id="mainMenu" class="ui-overlay">
        <div class="box">
            <h1>🎮 HANS ORB BLAST</h1>
            <p style="color:#ccc; margin-bottom:10px;">Pecahkan bola, kumpulkan koin!</p>
            <div class="stat">🪙 Koin: <span id="menuBalance">0</span> (Rp <span id="menuRupiah">0</span>)</div>
            <div style="margin: 15px 0;">
                <div style="font-size: 14px; margin-bottom: 5px;">Progress WD: <span id="wdProgress">0</span>/<span id="wdTargetMenu">30</span></div>
                <div style="width:100%; height:10px; background:rgba(0,0,0,0.3); border-radius:5px; overflow:hidden;">
                    <div id="wdProgressBar" style="height:100%; background:#00ff88; width:0%;"></div>
                </div>
            </div>
            
            <!-- ✅ TOMBOL BONUS & MAIN LANGSUNG AKTIF -->
            <button class="btn btn-danger" onclick="showBonusAd()">🎁 KLAIM BONUS (200 KOIN)</button>
            <button class="btn btn-primary" onclick="startGame()">▶ MULAI MAIN</button>
            <button class="btn btn-wd" onclick="showWithdraw()">💸 TARIK SALDO</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="center-overlay">
        <div class="center-box">
            <button class="emergency-close" onclick="forceCloseAll()">✖</button>
            <h2 style="color:white;">⏳ SELESAI MAIN!</h2>
            <div class="timer-text" id="adTimer">5</div>
            <button id="adBtn" class="overlay-btn" disabled>TUNGGU...</button>
        </div>
    </div>

    <div id="bonusOverlay" class="center-overlay">
        <div class="center-box">
            <button class="emergency-close" onclick="forceCloseAll()">✖</button>
            <h2 style="color:white;"> BONUS HARIAN</h2>
            <div class="timer-text" id="bonusTimer">5</div>
            <button id="bonusBtn" class="overlay-btn" disabled>TUNGGU...</button>
        </div>
    </div>

    <div id="withdrawMenu" class="ui-overlay hidden">
        <div class="box">
            <h2 style="color:#ffd700;">💸 Tarik Saldo</h2>
            <p style="margin:10px 0;">Saldo: Rp <span id="wdBalanceRupiah">0</span></p>
            <p style="margin:10px 0; color:#ffd700;">Iklan: <span id="wdAdsWatched">0</span>/<span id="wdAdsTarget">30</span></p>
            <button class="btn btn-primary" onclick="openInputModal(1000)">WD Rp 1.000 (50rb Koin)</button>
            <button class="btn btn-secondary" onclick="showMainMenu()">Kembali</button>
        </div>
    </div>

    <div id="inputModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:#ffd700; margin-bottom:15px;">Data Rekening</h3>
            <div class="input-group"><label>Nomor DANA</label><input type="number" id="inputDana" placeholder="08xx"></div>
            <div class="input-group"><label>Nama Pemilik</label><input type="text" id="inputName" placeholder="Nama"></div>
            <button class="btn btn-primary" onclick="finalizeWithdrawal()">KIRIM</button>
            <button class="btn btn-secondary" onclick="closeModal('inputModal')">Batal</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBwI7yZZVyNmH_HLsKFE-jSaTfVApIVYcQ", authDomain: "hansorbblast.firebaseapp.com", projectId: "hansorbblast", storageBucket: "hansorbblast.firebasestorage.app", messagingSenderId: "562424899290", appId: "1:562424899290:web:75e0c912db1ada3341e7e3" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let gameState = 'menu', score = 0;
        let coins = parseInt(localStorage.getItem('hans_coins')) || 0;
        let wdClicks = parseInt(localStorage.getItem('hans_wd_clicks')) || 0;
        let isFirstWD = !localStorage.getItem('hans_first_wd_done');
        const ADS_REQUIRED = isFirstWD ? 30 : 50;
        let adsWatched = parseInt(localStorage.getItem('hans_ads_watched')) || 0;
        let playerId = localStorage.getItem('hans_player_id') || 'player_' + Date.now();
        if(!localStorage.getItem('hans_player_id')) localStorage.setItem('hans_player_id', playerId);

        let adInterval, bonusInterval, adWasOpen = false;
        let balls = [], particles = [];
        const colors = ['#FF3B30', '#007AFF', '#34C759', '#FFCC00', '#AF52DE', '#FF9500'];
        let audioCtx = null;

        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            if(type === 'pop') { osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if(type === 'bonus') { [523.25, 659.25, 783.99].forEach((freq, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = freq; g.gain.setValueAtTime(0.2, now + i*0.05); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3); o.start(now + i*0.05); o.stop(now + 0.3); }); } 
            else if(type === 'start') { [440, 554.37, 659.25].forEach((freq, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = freq; g.gain.setValueAtTime(0.2, now + i*0.08); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3); o.start(now + i*0.08); o.stop(now + 0.3); }); }
        }
        function toggleSound() { playSound('start'); }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);

        class Ball {
            constructor() {
                this.radius = 30 + Math.random() * 20;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                this.dx = (Math.random() - 0.5) * 6; this.dy = (Math.random() - 0.5) * 6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.value = Math.floor(this.radius);
            }
            update() {
                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) this.dx = -this.dx;
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) this.dy = -this.dy;
                this.x += this.dx; this.y += this.dy;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.value, this.x, this.y);
            }
        }
        class Particle {
            constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.size = Math.random() * 6 + 3; this.dx = (Math.random() - 0.5) * 12; this.dy = (Math.random() - 0.5) * 12; this.life = 1; }
            update() { this.x += this.dx; this.y += this.dy; this.life -= 0.04; }
            draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
        }

        function initGame() { balls = []; for (let i = 0; i < 10; i++) balls.push(new Ball()); }
        function animate() {
            if (gameState !== 'playing') return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balls.forEach(b => { b.update(); b.draw(); });
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing') return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left; const clickY = e.clientY - rect.top;
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (Math.hypot(clickX - b.x, clickY - b.y) < b.radius + 15) {
                    for (let j = 0; j < 15; j++) particles.push(new Particle(b.x, b.y, b.color));
                    score += b.value; playSound('pop');
                    
                    let reward = b.value; 
                    let currentRupiah = Math.floor(coins / 50);
                    if (currentRupiah < 100) reward = b.value * 5;
                    else if (currentRupiah < 1000) reward = b.value * 2;
                    else reward = Math.floor(b.value * 0.2);
                    
                    coins += reward; wdClicks = Math.min(wdClicks + 1, ADS_REQUIRED);
                    localStorage.setItem('hans_coins', coins); localStorage.setItem('hans_wd_clicks', wdClicks);
                    updateUI(); balls.splice(i, 1);
                    
                    if (balls.length === 0) {
                        setTimeout(() => {
                            gameState = 'menu';
                            triggerAd('⏳ SELESAI MAIN!', () => { showMainMenu(); initGame(); });
                        }, 1000);
                    }
                    break;
                }
            }
        });

        // ✅ FUNGSI IKLAN ANTI-STUCK (PAKAI TIMESTAMP)
        function triggerAd(title, callback) {
            const overlay = document.getElementById('gameOverOverlay');
            overlay.style.display = 'flex';
            adWasOpen = true;

            const timerEl = document.getElementById('adTimer');
            const btn = document.getElementById('adBtn');

            timerEl.innerText = "5";
            btn.disabled = true;
            btn.classList.remove('ready');
            btn.innerText = "TUNGGU...";
            btn.onclick = null;

            window.open('https://www.profitableratecpmnetwork.com/e2ij2swi?key=698a3fbdfb6f8c59827bbc600706ffe1', '_blank');

            const waitTime = 5000; 
            const startTime = Date.now();

            const checkTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.ceil((waitTime - elapsed) / 1000);

                if (remaining > 0) {
                    timerEl.innerText = remaining;
                } else {
                    clearInterval(checkTimer);
                    timerEl.innerText = "0";
                    btn.disabled = false;
                    btn.classList.add('ready');
                    btn.innerText = "✅ KLAIM HADIAH";

                    btn.onclick = () => {
                        overlay.style.display = 'none';
                        adWasOpen = false;
                        adsWatched++;
                        localStorage.setItem('hans_ads_watched', adsWatched);
                        if (callback) callback();
                        updateUI();
                    };
                }
            }, 100);
        }

        function showBonusAd() {
            const overlay = document.getElementById('bonusOverlay');
            overlay.style.display = 'flex';
            adWasOpen = true;

            const timerEl = document.getElementById('bonusTimer');
            const btn = document.getElementById('bonusBtn');

            timerEl.innerText = "5";
            btn.disabled = true;
            btn.classList.remove('ready');
            btn.innerText = "TUNGGU...";
            btn.onclick = null;

            window.open('https://www.profitableratecpmnetwork.com/e2ij2swi?key=698a3fbdfb6f8c59827bbc600706ffe1', '_blank');

            const waitTime = 5000;
            const startTime = Date.now();

            const checkTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.ceil((waitTime - elapsed) / 1000);

                if (remaining > 0) {
                    timerEl.innerText = remaining;
                } else {
                    clearInterval(checkTimer);
                    timerEl.innerText = "0";
                    btn.disabled = false;
                    btn.classList.add('ready');
                    btn.innerText = "KLAIM BONUS ";

                    btn.onclick = () => {
                        overlay.style.display = 'none';
                        adWasOpen = false;
                        coins += 200;
                        adsWatched++;
                        localStorage.setItem('hans_coins', coins);
                        localStorage.setItem('hans_ads_watched', adsWatched);
                        updateUI();
                        alert('Dapat 200 koin!');
                    };
                }
            }, 100);
        }

        function startGame() { 
            initAudio(); playSound('start'); gameState = 'playing'; score = 0;
            document.getElementById('mainMenu').classList.add('hidden'); 
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('soundToggle').style.display = 'block';
            document.getElementById('backToMenuBtn').style.display = 'block';
            initGame(); animate(); 
        }
        function showMainMenu() { 
            gameState='menu'; 
            document.getElementById('withdrawMenu').classList.add('hidden'); 
            document.getElementById('mainMenu').classList.remove('hidden'); 
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('soundToggle').style.display = 'none';
            document.getElementById('backToMenuBtn').style.display = 'none';
            updateUI(); 
        }
        function backToMenu() { gameState = 'menu'; showMainMenu(); }
        function forceCloseAll() { 
            document.querySelectorAll('.center-overlay').forEach(el=>el.style.display='none'); 
            document.querySelectorAll('.modal-overlay').forEach(el=>el.style.display='none'); 
            clearInterval(adInterval); clearInterval(bonusInterval); 
            adWasOpen=false; 
            showMainMenu(); 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showWithdraw() { document.getElementById('mainMenu').classList.add('hidden'); document.getElementById('withdrawMenu').classList.remove('hidden'); document.getElementById('wdBalanceRupiah').innerText=Math.floor(coins/50); document.getElementById('wdAdsWatched').innerText=adsWatched; document.getElementById('wdAdsTarget').innerText=ADS_REQUIRED; }
        function openInputModal() { document.getElementById('inputModal').style.display = 'flex'; }
        
        function finalizeWithdrawal() {
            let dana = document.getElementById('inputDana').value; let name = document.getElementById('inputName').value;
            if(coins < 50000) { alert('Koin belum cukup! Butuh 50.000'); return; }
            if(adsWatched < ADS_REQUIRED) { alert(`Butuh ${ADS_REQUIRED} iklan! Kamu baru ${adsWatched}`); return; }
            db.collection('withdrawals').add({ playerId, danaNumber: dana, accountName: name.toUpperCase(), amountRupiah: 1000, amountCoins: 50000, timestamp: firebase.firestore.FieldValue.serverTimestamp(), status: 'pending', source: 'HansOrb', gameName: 'Hans Orb Blast' }).then(()=>{
                coins-=50000; adsWatched=0; wdClicks=0; localStorage.setItem('hans_coins', coins); localStorage.setItem('hans_wd_clicks', 0); localStorage.setItem('hans_ads_watched', 0);
                if(isFirstWD) { localStorage.setItem('hans_first_wd_done', 'true'); isFirstWD=false; }
                alert('WD Terkirim!'); closeModal('inputModal'); showMainMenu();
            }).catch(e=>alert('Error: '+e.message));
        }

        function updateUI() {
            document.getElementById('menuBalance').innerText = coins.toLocaleString('id-ID');
            document.getElementById('menuRupiah').innerText = Math.floor(coins/50).toLocaleString('id-ID');
            document.getElementById('wdProgress').innerText = wdClicks;
            document.getElementById('wdTargetDisplay').innerText = ADS_REQUIRED;
            document.getElementById('wdTargetMenu').innerText = ADS_REQUIRED;
            document.getElementById('wdProgressBar').style.width = ((wdClicks/ADS_REQUIRED)*100)+'%';
        }

        resizeCanvas(); updateUI(); initGame();
        document.addEventListener('click', () => { initAudio(); }, { once: true });
    </script>
</body>
</html>
