    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); 
            color: white;

            overflow: hidden;

        #gameCanvas { 
            display: block;

        .ui-overlay {

            display: flex;

        .box { 
            background: rgba(255,255,255,0.95);

        }
        
        .subtitle { 
            color: #666; 
            font-size: 14px; 
            margin-bottom: 15px;
        }
        
        .stat { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); 
            color: white; 
            padding: 12px; 
            border-radius: 15px; 
            margin: 10px 0; 
            font-size: 16px; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,154,158,0.3);
        }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: none; 
            border-radius: 15px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
            transition: transform 0.1s;

        .btn:active { transform: scale(0.98); }

        #hud {

            display: none;

        .center-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.95); 
            z-index: 9999999; 
            display: none;

        .center-box { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);

        .timer-text {

            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .overlay-btn { 
            background: #555; 
            color: #aaa; 
            border: none; 
            padding: 18px; 
            border-radius: 50px; 
            font-size: 20px; 
            font-weight: bold; 
            width: 100%; 
            cursor: not-allowed; 
        }
        .overlay-btn.ready { 
            background: #2ed573; 
            color: white; 
            cursor: pointer; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .emergency-close { 
            position: absolute; 
            top: 10px; right: 15px; 
            background: red; 
            color: white; 
            border: 2px solid white; 
            width: 35px; height: 35px; 
            border-radius: 50%; 
            font-size: 20px; 
            cursor: pointer;

        }

        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 50; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .modal-box { 
            background: #2c3e50; 
            border-radius: 15px;

            width: 90%; 
            max-width: 350px; 
            border: 2px solid #ffd700; 
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #555; 
            background: #1a252f; 
            color: white; 
            font-size: 16px; 
            margin-top: 5px; 
        }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div class="hud-item">💰 <span id="coinDisplay">0</span></div>
        <div class="hud-item">WD: <span id="wdDisplay">0</span>/<span id="wdTargetDisplay">30</span></div>

    <canvas id="gameCanvas"></canvas>
    <button id="backToMenuBtn" onclick="backToMenu()">◀ MENU</button>

    <div id="mainMenu" class="ui-overlay">
        <div class="box">
            <h1>🍹 COCKTAIL CUAN</h1>
            <p class="subtitle">Ketuk buah, bikin cocktail, dapat cuan!</p>
            <div class="stat">💰 Koin: <span id="menuBalance">0</span> (Rp <span id="menuRupiah">0</span>)</div>
            <div style="margin: 15px 0;">
                <div style="font-size: 14px; margin-bottom: 5px;">Progress WD: <span id="wdProgress">0</span>/<span id="wdTargetMenu">30</span></div>
                <div style="width:100%; height:10px; background:rgba(0,0,0,0.3); border-radius:5px; overflow:hidden;">

    <div id="gameOverOverlay" class="center-overlay">
        <div class="center-box">
            <button class="emergency-close" onclick="forceCloseAll()">✖</button>
            <h2 style="color:white;">💥 GAME OVER!</h2>
            <p style="color:#ddd; margin:10px 0;">Tonton iklan untuk dapat 100 koin & lanjut</p>
            <div class="timer-text" id="adTimer">5</div>
            <button id="adBtn" class="overlay-btn" disabled>TUNGGU...</button>
        </div>
    </div>

    <div id="bonusOverlay" class="center-overlay">
        <div class="center-box">
            <button class="emergency-close" onclick="forceCloseAll()">✖</button>
            <h2 style="color:white;">🎁 BONUS HARIAN</h2>
            <div class="timer-text" id="bonusTimer">5</div>
            <button id="bonusBtn" class="overlay-btn" disabled>TUNGGU...</button>
        </div>

    <div id="withdrawMenu" class="ui-overlay hidden">
        <div class="box">
            <h2>💸 Tarik Saldo</h2>
            <p style="margin:10px 0;">Saldo: Rp <span id="wdBalanceRupiah">0</span></p>
            <p style="margin:10px 0; color:#ffd700;">Iklan: <span id="wdAdsWatched">0</span>/<span id="wdAdsTarget">30</span></p>
            <button class="btn btn-primary" onclick="openInputModal()">WD Rp 1.000 (50rb Koin)</button>
            <button class="btn btn-secondary" onclick="showMainMenu()">Kembali</button>
        </div>
    </div>

    <div id="inputModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:#ffd700; margin-bottom:15px;">Data Rekening</h3>
            <div class="input-group"><label>Nomor DANA</label><input type="number" id="inputDana" placeholder="08xx"></div>
            <div class="input-group"><label>Nama Pemilik</label><input type="text" id="inputName" placeholder="Nama"></div>
            <button class="btn btn-primary" onclick="finalizeWithdrawal()">KIRIM</button>
            <button class="btn btn-secondary" onclick="closeModal('inputModal')">Batal</button>
        </div>
    </div>

    <script>
        // 🔥 FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyBwI7yZZVyNmH_HLsKFE-jSaTfVApIVYcQ", 
            authDomain: "hansorbblast.firebaseapp.com", 
            projectId: "hansorbblast", 
            storageBucket: "hansorbblast.firebasestorage.app", 
            messagingSenderId: "562424899290", 
            appId: "1:562424899290:web:75e0c912db1ada3341e7e3" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let coins = parseInt(localStorage.getItem('hans_coins')) || 0;
        let wdClicks = parseInt(localStorage.getItem('hans_wd_clicks')) || 0;
        let isFirstWD = !localStorage.getItem('hans_first_wd_done');
        const ADS_REQUIRED = isFirstWD ? 30 : 50;
        let adsWatched = parseInt(localStorage.getItem('cocktail_ads_watched')) || 0;
        let playerId = localStorage.getItem('hans_player_id');
        
        let adInterval, bonusInterval, adWasOpen = false;
        let gameState = 'menu';
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let fruits = [];
        let particles = [];
        let collectedFruits = {};
        let spawnTimer = 0;
        let spawnInterval = 60;
        let difficulty = 1;
        let missedCount = 0;

        const ADSTERRA_DIRECT_LINK = 'https://www.profitableratecpmnetwork.com/a133gb52d1?key=6b5a44c9d0fa46a91e813ecc123628a3';

        // ✅ PLAYER TRACKING
        if (!playerId) {
            playerId = 'player_' + Date.now();
            localStorage.setItem('hans_player_id', playerId);
            db.collection('players').doc(playerId).set({ 
                totalCoins: 0, 
                isOnline: true,
                lastVisit: firebase.firestore.FieldValue.serverTimestamp(), 
                createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            }).catch(err => console.log('Firebase init error:', err));
        } else {
            db.collection('players').doc(playerId).update({ 
                isOnline: true,
                lastVisit: firebase.firestore.FieldValue.serverTimestamp() 
            }).catch(err => console.log('Firebase update error:', err));
        }
        window.addEventListener('beforeunload', () => { 
            db.collection('players').doc(playerId).update({ isOnline: false }).catch(() => {}); 
        });
        document.addEventListener('visibilitychange', () => { 
            if (document.visibilityState === 'visible' && adWasOpen) { 
                adWasOpen = false; 
                forceCloseAll(); 
            } 
        });

        function trackGamePlay(gameName) {
            db.collection('players').doc(playerId).set({
                lastPlayedGame: gameName, 
                lastPlayedTime: firebase.firestore.FieldValue.serverTimestamp(),
                gamesPlayed: firebase.firestore.FieldValue.arrayUnion(gameName)
            }, { merge: true }).catch(err => console.error(err));
        }

        function updatePlayerCoins(earned) { 
            db.collection('players').doc(playerId).update({ 
                totalCoins: firebase.firestore.FieldValue.increment(earned), 
                lastVisit: firebase.firestore.FieldValue.serverTimestamp() 
            }).catch(() => {}); 
        }

        // ✅ SEMUA EMOJI DIISI
        const fruitTypes = [
            { emoji: '🍎', name: 'apel', color: '#FF3B30' },
            { emoji: '🍊', name: 'jeruk', color: '#FF9500' },
            { emoji: '🍋', name: 'lemon', color: '#FFEB3B' },
            { emoji: '🍉', name: 'semangka', color: '#FF4757' },
            { emoji: '🍇', name: 'anggur', color: '#9B59B6' },
            { emoji: '🍓', name: 'stroberi', color: '#FF2D55' }
        ];

        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas);

        class Fruit {
            constructor() {
                const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                this.emoji = type.emoji;
                this.name = type.name;
                this.color = type.color;
                this.size = 50;
                this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
                this.y = -this.size;
                this.vy = 2 + Math.random() * 2 + difficulty * 0.5;
                this.vx = (Math.random() - 0.5) * 2;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.collected = false;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.rotation += this.rotationSpeed;

                if (this.x < this.size || this.x > canvas.width - this.size) {
                    this.vx = -this.vx;
                }

                // ✅ HITUNG BUAH YANG KELEWAT
                if (this.y > canvas.height + this.size) {
                    missedCount++;
                    return false;
                }

                return true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }

            checkHit(clickX, clickY) {
                return Math.hypot(clickX - this.x, clickY - this.y) < this.size * 0.6;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 8 + 4;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5;
                this.life -= 0.03;
            }

            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function spawnFruit() {
            fruits.push(new Fruit());
        }

        function collectFruit(fruit) {
            fruit.collected = true;
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            // ✅ MODE GACOR 3 FASE
            let baseReward = 10;
            let currentRupiah = Math.floor(coins / 50);
            let reward = baseReward;
            
            if (currentRupiah < 100) {
                reward = baseReward * 5; // SUPER GACOR: 50 koin
            } else if (currentRupiah < 1000) {
                reward = baseReward * 2; // GACOR: 20 koin
            } else {
                reward = Math.floor(baseReward * 0.2); // SLOW MODE: 2 koin
            }

            const comboBonus = Math.floor(combo / 3) * 5;
            reward += comboBonus;

            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(fruit.x, fruit.y, fruit.color));
            }

            if (!collectedFruits[fruit.name]) {
                collectedFruits[fruit.name] = 0;
            }
            collectedFruits[fruit.name]++;

            // ✅ BONUS COCKTAIL (3 BUAH SAMA)
            if (collectedFruits[fruit.name] >= 3) {
                reward += 100; // Bonus besar!
                collectedFruits[fruit.name] = 0;
                combo += 2;
            }

            coins += reward;
            wdClicks = Math.min(wdClicks + 1, ADS_REQUIRED);
            localStorage.setItem('hans_coins', coins);
            localStorage.setItem('hans_wd_clicks', wdClicks);
            updatePlayerCoins(reward);
            updateUI();

            difficulty = 1 + Math.floor(coins / 200) * 0.5;
            spawnInterval = Math.max(20, 60 - Math.floor(coins / 100) * 5);
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#ff9a9e');
            gradient.addColorStop(0.5, '#fad0c4');
            gradient.addColorStop(1, '#a8edea');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function animate() {
            if (gameState !== 'playing') return;

            drawBackground();

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnFruit();
                spawnTimer = 0;
            }

            fruits = fruits.filter(f => {
                const alive = f.update();
                if (alive && !f.collected) {
                    f.draw();
                    return true;
                }
                return false;
            });

            particles = particles.filter(p => {
                p.update();
                if (p.life > 0) {
                    p.draw();
                    return true;
                }
                return false;
            });

            // ✅ GAME OVER JIKA BUAH KELEWAT TERLALU BANYAK
            if (missedCount > 10) {
                endGame();
                return;
            }

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing') return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                if (!fruit.collected && fruit.checkHit(clickX, clickY)) {
                    collectFruit(fruit);
                    fruits.splice(i, 1);
                    break;
                }
            }
        });

        function startGame() { 
            trackGamePlay('CocktailCuan');
            gameState = 'playing'; 
            score = 0; 
            combo = 0; 
            maxCombo = 0;
            fruits = []; 
            particles = []; 
            collectedFruits = {};
            spawnTimer = 0;
            spawnInterval = 60;
            difficulty = 1;
            missedCount = 0;
            
            document.getElementById('mainMenu').classList.add('hidden'); 
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('backToMenuBtn').style.display = 'block';
            
            animate(); 
        }

        function endGame() {
            gameState = 'menu';
            triggerAd('💥 GAME OVER!', 'Tonton iklan untuk dapat 100 koin & lanjut', () => {
                coins += 100;
                localStorage.setItem('hans_coins', coins);
                updatePlayerCoins(100);
                updateUI();
                showMainMenu();
            });
        }

        function showMainMenu() { 
            gameState = 'menu'; 
            document.getElementById('mainMenu').classList.remove('hidden'); 
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('backToMenuBtn').style.display = 'none';
            updateUI();
        }

        function backToMenu() { 
            gameState = 'menu'; 
            showMainMenu(); 
        }

        function forceCloseAll() { 
            document.querySelectorAll('.center-overlay').forEach(el => el.style.display = 'none'); 
            document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none'); 
            clearInterval(adInterval); 
            clearInterval(bonusInterval); 
            adWasOpen = false; 
            showMainMenu(); 
        }

        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
        }

        function triggerAd(title, desc, callback) {
            document.getElementById('gameOverOverlay').style.display = 'flex'; 
            adWasOpen = true;
            const timerEl = document.getElementById('adTimer'); 
            const btn = document.getElementById('adBtn');
            timerEl.innerText = "5"; 
            btn.disabled = true; 
            btn.classList.remove('ready'); 
            btn.innerText = "TUNGGU..."; 
            btn.onclick = null;
            window.open(ADSTERRA_DIRECT_LINK, '_blank');
            const waitTime = 5000; 
            const startTime = Date.now();
            adInterval = setInterval(() => { 
                const elapsed = Date.now() - startTime; 
                const remaining = Math.ceil((waitTime - elapsed) / 1000);
                if (remaining > 0) { 
                    timerEl.innerText = remaining; 
                } else { 
                    clearInterval(adInterval); 
                    timerEl.innerText = "0"; 
                    btn.disabled = false; 
                    btn.classList.add('ready'); 
                    btn.innerText = "KLAIM 100 KOIN"; 
                    btn.onclick = () => { 
                        document.getElementById('gameOverOverlay').style.display = 'none'; 
                        adWasOpen = false; 
                        adsWatched++; 
                        localStorage.setItem('cocktail_ads_watched', adsWatched); 
                        if (callback) callback(); 
                        updateUI(); 
                    };
                } 
            }, 100);
        }

        function showBonusAd() {
            document.getElementById('bonusOverlay').style.display = 'flex'; 
            adWasOpen = true;
            const timerEl = document.getElementById('bonusTimer'); 
            const btn = document.getElementById('bonusBtn');
            timerEl.innerText = "5"; 
            btn.disabled = true; 
            btn.classList.remove('ready'); 
            btn.innerText = "TUNGGU..."; 
            btn.onclick = null;
            window.open(ADSTERRA_DIRECT_LINK, '_blank');
            const waitTime = 5000; 
            const startTime = Date.now();
            bonusInterval = setInterval(() => { 
                const elapsed = Date.now() - startTime; 
                const remaining = Math.ceil((waitTime - elapsed) / 1000);
                if (remaining > 0) { 
                    timerEl.innerText = remaining; 
                } else { 
                    clearInterval(bonusInterval); 
                    timerEl.innerText = "0"; 
                    btn.disabled = false; 
                    btn.classList.add('ready'); 
                    btn.innerText = "KLAIM BONUS"; 
                    btn.onclick = () => { 
                        document.getElementById('bonusOverlay').style.display = 'none'; 
                        adWasOpen = false; 
                        coins += 200; 
                        adsWatched++; 
                        localStorage.setItem('hans_coins', coins); 
                        localStorage.setItem('cocktail_ads_watched', adsWatched); 
                        updatePlayerCoins(200); 
                        updateUI(); 
                        alert('🎉 Dapat 200 koin!'); 
                    };
                } 
            }, 100);
        }

        function showWithdraw() { 
            document.getElementById('mainMenu').classList.add('hidden'); 
            document.getElementById('withdrawMenu').classList.remove('hidden'); 
            document.getElementById('wdBalanceRupiah').innerText = Math.floor(coins/50).toLocaleString('id-ID'); 
            document.getElementById('wdAdsWatched').innerText = adsWatched; 
            document.getElementById('wdAdsTarget').innerText = ADS_REQUIRED; 
        }

        function openInputModal() { 
            document.getElementById('inputModal').style.display = 'flex'; 
        }

        function finalizeWithdrawal() {
            let dana = document.getElementById('inputDana').value; 
            let name = document.getElementById('inputName').value;
            if (coins < 50000) { 
                alert('Koin belum cukup! Butuh 50.000'); 
                return; 
            }
            if (adsWatched < ADS_REQUIRED) { 
                alert(`Butuh ${ADS_REQUIRED} iklan! Kamu baru ${adsWatched}`); 
                return; 
            }
            db.collection('withdrawals').add({ 
                playerId, 
                danaNumber: dana, 
                accountName: name.toUpperCase(), 
                amountRupiah: 1000, 
                amountCoins: 50000, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp(), 
                status: 'pending', 
                source: 'CocktailCuan', 
                gameName: 'Cocktail Cuan', 
                adsWatched: ADS_REQUIRED 
            }).then(() => {
                coins -= 50000; 
                adsWatched = 0; 
                wdClicks = 0; 
                localStorage.setItem('hans_coins', coins); 
                localStorage.setItem('cocktail_ads_watched', 0); 
                localStorage.setItem('hans_wd_clicks', 0);
                if (isFirstWD) { 
                    localStorage.setItem('hans_first_wd_done', 'true'); 
                    isFirstWD = false; 
                }
                alert('✅ WD Terkirim!'); 
                closeModal('inputModal'); 
                showMainMenu();
            }).catch(e => alert('Error: ' + e.message));
        }

        function updateUI() {
            document.getElementById('menuBalance').innerText = coins.toLocaleString('id-ID');
            document.getElementById('menuRupiah').innerText = Math.floor(coins/50).toLocaleString('id-ID');
            document.getElementById('coinDisplay').innerText = coins.toLocaleString('id-ID');
            document.getElementById('wdDisplay').innerText = wdClicks;
            document.getElementById('wdProgress').innerText = wdClicks;
            document.getElementById('wdTargetDisplay').innerText = ADS_REQUIRED;
            document.getElementById('wdTargetMenu').innerText = ADS_REQUIRED;
            document.getElementById('wdProgressBar').style.width = ((wdClicks/ADS_REQUIRED)*100)+'%';
        }

        resizeCanvas(); 
        updateUI();
    </script>
</body>
</html>
