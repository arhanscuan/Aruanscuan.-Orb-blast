<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Cuan - Cocokkan Kartu!</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #topBar {
            background: rgba(255,255,255,0.1); padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            flex-wrap: wrap; gap: 5px;
        }
        .info-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .stat-badge { background: rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .stat-badge.gold { background: #ffd700; color: #333; }
        .btn { border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; }
        .btn:active { transform: scale(0.95); }
        .btn-reset { background: #95a5a6; }
        .btn-lobby { background: #667eea; }
        #gameArea { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            padding: 10px; position: relative;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%; max-width: 350px;
        }
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3);
            transition: transform 0.2s, background 0.3s;
        }
        .card:active { transform: scale(0.95); }
        .card.flipped { background: white; border-color: #ffd700; }
        .card.matched { background: #2ed573; border-color: #fff; opacity: 0.8; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: #2c3e50; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; border: 3px solid #ffd700; }
        .btn-action { background: #2ed573; color: white; border: none; padding: 12px; border-radius: 25px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-close { background: #95a5a6; }
    </style>
</head>
<body>

    <div id="topBar">
        <div class="info-box">
            <div class="stat-badge gold">🏆 Langkah: <span id="moveDisplay">0</span></div>
            <div class="stat-badge">🎯 Cocok: <span id="matchDisplay">0/8</span></div>
        </div>
        <div class="info-box">
            <button class="btn btn-reset" id="btnReset">🔄 Reset</button>
            <button class="btn btn-lobby" id="btnLobby">🏠 Lobby</button>
        </div>
    </div>

    <div id="gameArea">
        <div id="grid"></div>
    </div>

    <div id="winModal" class="modal">
        <div class="modal-box">
            <h2 style="color:#ffd700; margin-bottom:10px;">🎉 MENANG!</h2>
            <p style="color:#ddd; font-size:16px; margin-bottom:15px;">Kamu menyelesaikan dalam <b id="finalMoves">0</b> langkah!</p>
            <p style="color:#ffd700; font-size:14px; margin-bottom:15px;">🏆 Skor Terbaik: <span id="bestDisplay">-</span></p>
            <button class="btn-action" id="btnPlayAgain">🔄 Main Lagi</button>
            <button class="btn-action btn-close" id="btnBackLobby">🏠 Kembali ke Lobby</button>
        </div>
    </div>

    <script>
        // 🔥 FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyBwI7yZZVyNmH_HLsKFE-jSaTfVApIVYcQ",
          authDomain: "hansorbblast.firebaseapp.com",
          projectId: "hansorbblast",
          storageBucket: "hansorbblast.firebasestorage.app",
          messagingSenderId: "562424899290",
          appId: "1:562424899290:web:75e0c912db1ada3341e7e3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let playerId = localStorage.getItem('hans_player_id');
        if (!playerId) {
            playerId = 'player_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
            localStorage.setItem('hans_player_id', playerId);
            db.collection('players').doc(playerId).set({ 
                playerId: playerId,
                totalCoins: 0, 
                isOnline: true,
                lastVisit: firebase.firestore.FieldValue.serverTimestamp(), 
                firstVisit: firebase.firestore.FieldValue.serverTimestamp(),
                game: 'MemoryCuan',
                gamesPlayed: firebase.firestore.FieldValue.arrayUnion('MemoryCuan')
            }).catch(err => console.log('Firebase error:', err));
        } else {
            db.collection('players').doc(playerId).set({ 
                isOnline: true,
                lastVisit: firebase.firestore.FieldValue.serverTimestamp(),
                lastPlayedGame: 'MemoryCuan',
                gamesPlayed: firebase.firestore.FieldValue.arrayUnion('MemoryCuan'),
                totalVisits: firebase.firestore.FieldValue.increment(1)
            }, { merge: true }).catch(err => console.log('Firebase error:', err));
        }

        window.addEventListener('beforeunload', () => {
            db.collection('players').doc(playerId).update({ isOnline: false }).catch(() => {});
        });

        function trackGamePlay(finalMoves) {
            db.collection('players').doc(playerId).set({
                memoryCuanGames: firebase.firestore.FieldValue.increment(1),
                lastScore: finalMoves,
                lastPlayedTime: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(err => console.error(err));
            
            db.collection('players').doc(playerId).get().then(doc => {
                const data = doc.data();
                if (!data || !data.memoryCuanBestScore || finalMoves < data.memoryCuanBestScore) {
                    db.collection('players').doc(playerId).update({ memoryCuanBestScore: finalMoves }).catch(() => {});
                }
            }).catch(() => {});
        }

        // 🎮 GAME LOGIC
        const FRUITS = ['🍒', '🍓', '🍇', '🍌', '🍎', '🍐', '🍑', '🍍'];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLocked = false;
        let bestScore = localStorage.getItem('memory_cuan_best') || '-';

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            isLocked = false;
            
            document.getElementById('moveDisplay').innerText = moves;
            document.getElementById('matchDisplay').innerText = '0/' + FRUITS.length;
            document.getElementById('bestDisplay').innerText = bestScore;
            document.getElementById('winModal').style.display = 'none';

            let deck = FRUITS.concat(FRUITS);
            deck.sort(function() { return Math.random() - 0.5; });

            deck.forEach(function(fruit, index) {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-fruit', fruit);
                card.setAttribute('data-index', index);
                card.addEventListener('click', function() { flipCard(card); });
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocked) return;
            if (card.classList.contains('flipped')) return;
            if (card.classList.contains('matched')) return;

            card.classList.add('flipped');
            card.innerText = card.getAttribute('data-fruit');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moveDisplay').innerText = moves;
                isLocked = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];
            if (card1.getAttribute('data-fruit') === card2.getAttribute('data-fruit')) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('matchDisplay').innerText = matchedPairs + '/' + FRUITS.length;
                flippedCards = [];
                isLocked = false;

                if (matchedPairs === FRUITS.length) {
                    setTimeout(function() {
                        if (bestScore === '-' || moves < parseInt(bestScore)) {
                            bestScore = moves;
                            localStorage.setItem('memory_cuan_best', bestScore);
                        }
                        document.getElementById('finalMoves').innerText = moves;
                        document.getElementById('bestDisplay').innerText = bestScore;
                        document.getElementById('winModal').style.display = 'flex';
                        trackGamePlay(moves);
                    }, 500);
                }
            } else {
                setTimeout(function() {
                    card1.classList.remove('flipped');
                    card1.innerText = '';
                    card2.classList.remove('flipped');
                    card2.innerText = '';
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        function goToLobby() {
            window.location.href = '/clean.html';
        }

        // 🎯 EVENT LISTENERS
        document.getElementById('btnReset').addEventListener('click', initGame);
        document.getElementById('btnPlayAgain').addEventListener('click', initGame);
        document.getElementById('btnLobby').addEventListener('click', goToLobby);
        document.getElementById('btnBackLobby').addEventListener('click', goToLobby);

        // 🚀 START GAME
        initGame();
    </script>
</body>
</html>
