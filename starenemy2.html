<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Star Enemy</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#050510;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;touch-action:none}
#gameCanvas{display:block;width:100%;height:100%;background:#0a0a1a}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,16,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10;overflow-y:auto}
.overlay.hidden{display:none}
.title{font-size:36px;font-weight:bold;color:#00ffff;text-shadow:0 0 15px rgba(0,255,255,0.5);margin-bottom:10px;text-align:center}
.subtitle{font-size:18px;color:#66ffff;margin-bottom:20px;text-align:center}
.info-box{background:rgba(17,24,39,0.9);border:1px solid rgba(0,255,255,0.4);border-radius:10px;padding:15px;margin:10px 0;max-width:350px;width:90%}
.info-box h3{color:#fbbf24;font-size:14px;margin-bottom:10px;text-align:center}
.info-box p{color:#d1d5db;font-size:13px;margin:6px 0}
.btn{padding:15px 40px;font-size:20px;font-weight:bold;border:2px solid #00ffff;border-radius:10px;cursor:pointer;margin:15px 0;color:white;background:#0891b2;box-shadow:0 0 15px rgba(0,255,255,0.3)}
.btn-danger{background:#dc2626;border-color:#ff4444}
.game-over-title{font-size:36px;font-weight:bold;color:#ef4444;text-shadow:0 0 15px rgba(239,68,68,0.5);margin-bottom:20px;text-align:center}
.score-display{font-size:20px;color:white;margin:10px 0;text-align:center}
.score-value{color:#00ffff;font-weight:bold;font-size:24px}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="menuOverlay" class="overlay">
    <div class="title">⭐ STAR ENEMY</div>
    <div class="subtitle">SPACE BATTLE MOBILE</div>
    <div class="info-box">
        <h3>🎯 CARA MAIN DI HP</h3>
        <p>👆 <b>Seret jari</b> di layar untuk gerak</p>
        <p>🔫 Pesawat <b>otomatis menembak</b></p>
        <p>💥 Hancurkan Boss untuk dapat Koin!</p>
    </div>
    <button id="startBtn" class="btn">MULAI BERMAIN</button>
</div>

<div id="gameOverOverlay" class="overlay hidden">
    <div class="game-over-title">💥 GAME OVER</div>
    <div class="score-display">Skor: <span class="score-value" id="finalScore">0</span></div>
    <div class="score-display">Level: <span class="score-value" id="finalLevel">1</span></div>
    <button id="restartBtn" class="btn btn-danger">MAIN LAGI</button>
</div>

<script>
// POKI SDK
let pokiReady = false;
if (typeof PokiSDK !== 'undefined') {
    PokiSDK.init().then(() => { pokiReady = true; }).catch(() => {});
}

const cv = document.getElementById('gameCanvas');
const cx = cv.getContext('2d');

// ✅ RESPONSIVE CANVAS (PENUH LAYAR HP)
let CW = window.innerWidth;
let CH = window.innerHeight;
cv.width = CW;
cv.height = CH;
window.addEventListener('resize', () => {
    CW = window.innerWidth;
    CH = window.innerHeight;
    cv.width = CW;
    cv.height = CH;
});

let gs='menu', score=0, level=1, lives=3, coins=0, fc=0;
let bossSpawned=false, bossWarning=false, bossIncoming=false;

// Player
const P = { x: CW/2, y: CH - 100, w: 40, h: 50, hp: 100, mhp: 100, inv: 0, aw: 'normal', sl: 0, ll: 0, hl: 0, shl: 0, sht: 0, st: 0, si: 8 };

let stars=[], bullets=[], lasers=[], enemies=[], particles=[], drops=[];
let touch = null;

function initStars(){
    stars=[];
    for(let i=0; i<100; i++) stars.push({x:Math.random()*CW, y:Math.random()*CH, s:1+Math.random()*3, sz:1+Math.random()*2});
}

// Sound
const snd = {
    c: null,
    init() { if(this.c) return; try { this.c = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} },
    tone(f, d, t='square', v=0.2) {
        if(!this.c) return;
        const o = this.c.createOscillator(), g = this.c.createGain();
        o.connect(g); g.connect(this.c.destination);
        o.type = t; o.frequency.setValueAtTime(f, this.c.currentTime);
        g.gain.setValueAtTime(v, this.c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.c.currentTime + d);
        o.start(); o.stop(this.c.currentTime + d);
    },
    shoot() { this.tone(800, 0.05); },
    boom() { this.tone(100, 0.3, 'sawtooth', 0.3); },
    pup() { this.tone(600, 0.1, 'sine'); setTimeout(()=>this.tone(800, 0.1, 'sine'), 100); }
};

function boom(x, y, n, c) {
    for(let i=0; i<n; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
            l: 20+Math.random()*20, ml: 40, c, sz: 2+Math.random()*3
        });
    }
}

// ✅ KONTROL SENTUH HALUS (SMOOTH FOLLOW)
cv.addEventListener('touchstart', e => { e.preventDefault(); touch = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive:false});
cv.addEventListener('touchmove', e => { e.preventDefault(); touch = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive:false});
cv.addEventListener('touchend', e => { e.preventDefault(); touch = null; }, {passive:false});

// Keyboard (untuk tes di PC)
const keys = new Set();
window.addEventListener('keydown', e => keys.add(e.key));
window.addEventListener('keyup', e => keys.delete(e.key));

function spawnEnemy() {
    if(bossSpawned) return;
    if(score >= level * 1500) { // Boss muncul lebih cepat
        bossWarning = true; bossIncoming = true;
        setTimeout(() => {
            bossWarning = false; bossIncoming = false;
            const isFinal = level >= 10;
            enemies.push({
                x: CW/2 - 60, y: -100, w: 120, h: 100,
                hp: 500 + level*100, mhp: 500 + level*100,
                t: 'boss', c: '#ff0066', pts: 2000 + level*500, inv: 0
            });
            bossSpawned = true;
            boom(CW/2, 100, 50, '#ff0066');
        }, 2000);
        return;
    }
    
    // Spawn musuh biasa
    const size = 30 + Math.random()*20;
    enemies.push({
        x: Math.random() * (CW - size), y: -50, w: size, h: size,
        spd: 2 + Math.random()*2 + level*0.2,
        hp: 1 + Math.floor(level/3), mhp: 1 + Math.floor(level/3),
        t: 'basic', c: ['#ff4444', '#ffaa00', '#aa44ff'][Math.floor(Math.random()*3)],
        pts: 50, inv: 0
    });
}

function loop() {
    if(gs !== 'playing') { requestAnimationFrame(loop); return; }
    fc++;
    
    // Clear & Background
    cx.fillStyle = '#050510';
    cx.fillRect(0, 0, CW, CH);
    
    // Stars
    stars.forEach(s => {
        s.y += s.s;
        if(s.y > CH) { s.y = 0; s.x = Math.random()*CW; }
        cx.fillStyle = `rgba(255,255,255,${0.3 + s.sz*0.2})`;
        cx.beginPath(); cx.arc(s.x, s.y, s.sz, 0, Math.PI*2); cx.fill();
    });

    // ✅ UPDATE POSISI PESAWAT (SMOOTH FOLLOW TOUCH)
    let tx = P.x, ty = P.y;
    if(touch) { tx = touch.x; ty = touch.y - 50; } // Offset dikit biar jari ga nutupin pesawat
    else if(keys.has('ArrowLeft')) tx = P.x - 8;
    else if(keys.has('ArrowRight')) tx = P.x + 8;
    
    // Smooth movement (Lerp)
    P.x += (tx - P.x) * 0.15;
    P.y += (ty - P.y) * 0.15;
    
    // Bounds
    P.x = Math.max(P.w/2, Math.min(CW - P.w/2, P.x));
    P.y = Math.max(P.h/2, Math.min(CH - P.h/2, P.y));

    // Auto Shoot
    P.st++;
    if(P.st >= P.si && !bossIncoming) {
        P.st = 0;
        bullets.push({x: P.x, y: P.y - P.h/2, vy: -12, ie: false, c: '#00ffff', sz: 4, dm: 1});
        snd.shoot();
    }

    // Spawn
    if(fc % 60 === 0) spawnEnemy();

    // Update Bullets
    bullets = bullets.filter(b => {
        b.y += b.vy;
        if(b.y < -20) return false;
        
        // Hit Enemy
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i];
            if(Math.abs(b.x - (e.x+e.w/2)) < e.w/2 && Math.abs(b.y - (e.y+e.h/2)) < e.h/2) {
                e.hp -= b.dm;
                boom(b.x, b.y, 5, b.c);
                if(e.hp <= 0) {
                    score += e.pts;
                    boom(e.x+e.w/2, e.y+e.h/2, 20, e.c);
                    snd.boom();
                    if(e.t === 'boss') {
                        level++; bossSpawned = false; coins += 100;
                    }
                    enemies.splice(i, 1);
                }
                return false;
            }
        }
        return true;
    });

    // Update Enemies
    enemies = enemies.filter(e => {
        e.y += (e.spd || 1);
        if(e.y > CH + 50) return false;
        
        // Hit Player
        if(P.inv <= 0) {
            let dx = P.x - (e.x+e.w/2);
            let dy = P.y - (e.y+e.h/2);
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < (P.w/2 + e.w/2)) {
                P.hp -= 20;
                P.inv = 60;
                boom(P.x, P.y, 15, '#ff0000');
                if(P.hp <= 0) {
                    lives--;
                    if(lives <= 0) {
                        gs = 'gameover';
                        document.getElementById('finalScore').innerText = score;
                        document.getElementById('finalLevel').innerText = level;
                        document.getElementById('gameOverOverlay').classList.remove('hidden');
                        if(pokiReady && typeof PokiSDK.commercialBreak === 'function') PokiSDK.commercialBreak();
                    } else {
                        P.hp = P.mhp; P.inv = 120;
                    }
                }
            }
        }
        return true;
    });

    // Update Particles
    particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.l--;
        cx.globalAlpha = p.l / p.ml;
        cx.fillStyle = p.c;
        cx.beginPath(); cx.arc(p.x, p.y, p.sz, 0, Math.PI*2); cx.fill();
        cx.globalAlpha = 1;
        return p.l > 0;
    });

    // ✅ DRAW ENEMIES (PAKAI OUTLINE PUTIH BIAR KELIATAN)
    enemies.forEach(e => {
        cx.save();
        cx.translate(e.x + e.w/2, e.y + e.h/2);
        
        // Bentuk Musuh
        cx.beginPath();
        if(e.t === 'boss') {
            cx.arc(0, 0, e.w/2, 0, Math.PI*2);
        } else {
            cx.moveTo(0, -e.h/2);
            cx.lineTo(e.w/2, e.h/2);
            cx.lineTo(-e.w/2, e.h/2);
            cx.closePath();
        }
        cx.fillStyle = e.c;
        cx.fill();
        
        // ✅ OUTLINE PUTIH TEBAL (BIAR GAK NYATU BACKGROUND)
        cx.strokeStyle = 'white';
        cx.lineWidth = 3;
        cx.stroke();
        
        // Health Bar Boss
        if(e.t === 'boss' && e.hp < e.mhp) {
            cx.fillStyle = '#333'; cx.fillRect(-e.w/2, -e.h/2 - 15, e.w, 6);
            cx.fillStyle = '#0f0'; cx.fillRect(-e.w/2, -e.h/2 - 15, e.w * (e.hp/e.mhp), 6);
        }
        cx.restore();
    });

    // ✅ DRAW BULLETS (BIAR KELIATAN)
    bullets.forEach(b => {
        cx.fillStyle = b.c;
        cx.shadowColor = b.c; cx.shadowBlur = 10;
        cx.beginPath(); cx.arc(b.x, b.y, b.sz, 0, Math.PI*2); cx.fill();
        cx.shadowBlur = 0;
    });

    // ✅ DRAW PLAYER
    if(P.inv <= 0 || Math.floor(P.inv/4)%2 === 0) {
        cx.save();
        cx.translate(P.x, P.y);
        cx.beginPath();
        cx.moveTo(0, -P.h/2);
        cx.lineTo(-P.w/2, P.h/2);
        cx.lineTo(0, P.h/2 - 10);
        cx.lineTo(P.w/2, P.h/2);
        cx.closePath();
        cx.fillStyle = '#00ddff';
        cx.fill();
        cx.strokeStyle = 'white'; cx.lineWidth = 2; cx.stroke(); // Outline pesawat juga
        cx.restore();
    }
    if(P.inv > 0) P.inv--;

    // UI
    cx.fillStyle = 'white'; cx.font = 'bold 16px Arial'; cx.textAlign = 'left';
    cx.fillText(`SKOR: ${score}`, 10, 30);
    cx.fillText(`LEVEL: ${level}`, 10, 55);
    cx.textAlign = 'right';
    cx.fillText(`NYAWA: ${'❤️'.repeat(lives)}`, CW-10, 30);

    if(bossWarning) {
        cx.fillStyle = `rgba(255,0,0,${Math.abs(Math.sin(fc*0.1))})`;
        cx.font = 'bold 30px Arial'; cx.textAlign = 'center';
        cx.fillText('⚠️ BOSS DATANG! ⚠️', CW/2, CH/2);
    }

    requestAnimationFrame(loop);
}

function start() {
    snd.init();
    P.x = CW/2; P.y = CH - 100; P.hp = 100; P.inv = 60;
    bullets = []; enemies = []; particles = [];
    score = 0; level = 1; lives = 3; coins = 0; bossSpawned = false;
    gs = 'playing';
    document.getElementById('menuOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('restartBtn').addEventListener('click', start);

initStars();
loop();
</script>
</body>
</html>
